name: Tikrinti skelbimus

on:
  schedule:
    - cron: "*/15 * * * *"   # kas ~15 min. (GitHub kartais pavėluoja kelias minutes)
  workflow_dispatch:          # galima paleisti ir rankiniu būdu: Actions → Run workflow

permissions:
  contents: write   # išsaugoti docs/listings.json
  issues: write     # pranešimai apie naujus skelbimus

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tikrinti portalus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py -c config.yaml --json-store docs/listings.json
      - name: Išsaugoti rezultatus
        run: |
          git config user.name "nt-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/listings.json
          git diff --cached --quiet || git commit -m "Skelbimai atnaujinti"
          git push || (git pull --rebase -X theirs && git push)
